name: Pattern Guardrails

# Bloqueia, por regex, os padrões que já causaram bug real e recorrente em
# produção (achados numa auditoria de ~64 PRs revisadas, 2026-08-26):
#   - filial_id.eq() escondendo recurso compartilhado (filial_id IS NULL)
#     — mesmo bug 3x nas PRs #82/#92/#95/#97/#103
#   - delete()/update() sem { count: "exact" } — RLS nega e a UI mostra
#     sucesso mesmo assim (PR #126, Todos.tsx/Fornecedores.tsx)
#   - STATUS_COLOR usado como `color` de texto em vez de fundo de pill —
#     falha WCAG 3:1 (PR #114)
# Isso é grep puro, sem custo de LLM — não substitui /code-review nem
# /security-review, só pega o que já se repetiu e é detectável por regex.
#
# Só escaneia uma JANELA em torno de cada hunk do diff da PR (não o
# arquivo inteiro) — achado real de @codex review na própria PR que
# introduziu este workflow (#134): já existem ~88 arquivos com
# .eq("filial_id"...) sem anotação; escanear o arquivo inteiro bloquearia
# qualquer edição futura neles, até uma que não toque a linha
# problemática. A janela cobre linhas ADICIONADAS *e* uma margem em torno
# de hunks só-de-remoção (achado real de 2ª rodada: remover só a linha
# `{ count: "exact" }` de um `.delete()` multi-linha é uma regressão real
# — reintroduz o bug de sucesso falso — mas não aparece como linha
# adicionada nenhuma; sem a margem, o arquivo inteiro seria pulado).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pattern_guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinado por SHA, não pela tag @v45 — tj-actions/changed-files já
      # sofreu um comprometimento real (tag re-apontada pra commit
      # malicioso, achado real de /code-review ultra local, PR #134) —
      # tag mutável não é defesa suficiente pra uma Action de terceiro
      # que roda em todo PR. SHA = o que a tag v45 apontava em
      # 2026-08-28; atualizar deliberadamente, nunca voltar pra `@v45`.
      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45
        with:
          files: |
            src/**/*.ts
            src/**/*.tsx
            supabase/functions/**/*.ts
          json: true

      - name: Scan added lines for known-bug patterns
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Passado via env, NUNCA interpolado direto no script (achado
          # real de /code-review ultra local, PR #134, P1 — um nome de
          # arquivo malicioso na PR quebraria pra fora de uma
          # substituição ${{ }} direta no bash e executaria comando
          # arbitrário no runner; isso é literalmente o vetor de
          # injeção documentado pelo GitHub pra Actions). json:true
          # também evita a ambiguidade de split por espaço quando um
          # path tem espaço no nome.
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          set -uo pipefail

          FAIL=0

          if [ "$CHANGED_FILES_JSON" = "[]" ] || [ -z "$CHANGED_FILES_JSON" ]; then
            echo "Nenhum arquivo relevante mudou."
            exit 0
          fi

          echo "Arquivos em checagem:"
          echo "$CHANGED_FILES_JSON" | jq -r '.[]'
          echo ""

          while IFS= read -r f; do
            [ -f "$f" ] || continue

            # Linhas em escopo: as que a PR ADICIONOU (número na versão
            # nova) MAIS uma margem de 10 linhas em torno do ponto de
            # cada hunk — cobre hunks só-de-remoção (ex.: apagar só a
            # linha `{ count: "exact" }` de um .delete() multi-linha,
            # que não conta como "adicionada" mas é uma regressão real).
            # Padrão pré-existente fora de qualquer hunk nunca entra
            # aqui, então nunca bloqueia uma PR que não tocou perto dele.
            SCOPE_LINES=$(git diff -U0 "$BASE_SHA"...HEAD -- "$f" 2>/dev/null \
              | grep -oP '^@@ -[0-9]+(,[0-9]+)? \+\K[0-9]+(,[0-9]+)?(?= @@)' \
              | awk -F, '{
                  start=$1; count=($2==""?1:$2);
                  lo=start-10; if (lo<1) lo=1;
                  hi=start+(count>0?count:1)+10;
                  for(i=lo;i<=hi;i++) print i
                }' | sort -nu)

            if [ -z "$SCOPE_LINES" ]; then
              continue
            fi

            # ------------------------------------------------------------
            # 1) .eq("filial_id" sem .or(...is.null) por perto — esconde
            #    recurso compartilhado (filial_id IS NULL). PRs #82/#92/
            #    #95/#97/#103.
            # ------------------------------------------------------------
            while IFS=: read -r lineno _; do
              [ -z "$lineno" ] && continue
              echo "$SCOPE_LINES" | grep -qx "$lineno" || continue
              start=$(( lineno > 5 ? lineno - 5 : 1 ))
              end=$(( lineno + 5 ))
              window=$(sed -n "${start},${end}p" "$f")
              if ! echo "$window" | grep -q 'filial_id\.is\.null\|filial_id.*IS NULL\|// filial-global-ok'; then
                echo "::error file=$f,line=$lineno::.eq(\"filial_id\"...) sem .or(...filial_id.is.null) nem comentário // filial-global-ok por perto — pode esconder recurso compartilhado (filial_id IS NULL). Ver CLAUDE.md §Filial compartilhada. Se for intencional, adicione o comentário // filial-global-ok na mesma linha ou até 5 linhas acima."
                FAIL=1
              fi
            done < <(grep -n '\.eq(["'"'"']filial_id["'"'"']' "$f" || true)

            # ------------------------------------------------------------
            # 2) .delete()/.update() do Supabase sem { count: "exact" } —
            #    sucesso falso quando RLS nega silenciosamente. PR #126.
            #    Contexto amplo (10 linhas antes) detecta chain multi-linha
            #    tipo .from("x") numa linha e .delete(...) na próxima —
            #    achado real de @codex review, a 1ª versão só olhava a
            #    mesma linha e perdia esse formato (o mais comum no repo).
            # ------------------------------------------------------------
            while IFS=: read -r lineno _; do
              [ -z "$lineno" ] && continue
              echo "$SCOPE_LINES" | grep -qx "$lineno" || continue
              ctx_start=$(( lineno > 10 ? lineno - 10 : 1 ))
              ctx_end=$(( lineno + 3 ))
              ctx=$(sed -n "${ctx_start},${ctx_end}p" "$f")
              # .from\(["'] exige aspas logo após o parêntese — bate em
              # .from("tabela") do Supabase, não em Array.from(x) (achado
              # real de @codex review: Array.from(selectedChildren) perto
              # de um Set.delete() qualquer disparava falso positivo).
              echo "$ctx" | grep -qE '\.from\(["'"'"']|supabase[A-Za-z]*\.' || continue
              start=$(( lineno > 3 ? lineno - 3 : 1 ))
              end=$(( lineno + 8 ))
              window=$(sed -n "${start},${end}p" "$f")
              if ! echo "$window" | grep -q 'count:\s*["'"'"']exact["'"'"']\|// count-exact-ok'; then
                echo "::error file=$f,line=$lineno::.delete()/.update() do Supabase sem { count: \"exact\" } por perto — se o RLS negar, a call retorna error:null/0 linhas e o código pode reportar sucesso falso (achado real: PR #126, Todos.tsx/Fornecedores.tsx). Adicione { count: \"exact\" } e cheque o count (não só error), ou // count-exact-ok se a call já é auto-limitada por PK/id único."
                FAIL=1
              fi
            done < <(grep -nE '\.(delete|update)\(' "$f" || true)

            # ------------------------------------------------------------
            # 3) STATUS_COLOR usado como `color` de texto (não fundo de
            #    pill) — falha WCAG 3:1 em card claro. PR #114.
            # ------------------------------------------------------------
            while IFS=: read -r lineno _; do
              [ -z "$lineno" ] && continue
              echo "$SCOPE_LINES" | grep -qx "$lineno" || continue
              echo "::error file=$f,line=$lineno::STATUS_COLOR é cor de FUNDO de pill, não tinta de texto — usar como \`color:\` falha contraste WCAG 3:1 em card claro (achado real: PR #114). Use pillStyle(tone) de statusPalette.ts."
              FAIL=1
            done < <(grep -nE 'color:\s*STATUS_COLOR' "$f" || true)
          done < <(echo "$CHANGED_FILES_JSON" | jq -r '.[]')

          # ------------------------------------------------------------
          # 4) Aviso (não bloqueia): hex fixo em array de cores de gráfico,
          #    em vez de chartPalette.ts. Heurística ruidosa de propósito —
          #    só avisa, não falha o job. Não restrito a linha adicionada
          #    (é aviso, não bloqueio — não há custo de falso positivo).
          #    **Não exige `COLORS`/`colors=` na MESMA linha do hex, NEM
          #    restringe por nome de arquivo** (achado real de
          #    /code-review ultra local, PR #134: a versão anterior
          #    exigia os dois — hex E `COLORS`/`colors=` na MESMA linha,
          #    E o path conter "dashboard"/"chart" — e nenhum dos 5
          #    arquivos que o próprio `chartPalette.ts` cita como alvo
          #    de migração batia nos dois filtros ao mesmo tempo:
          #    `Insights.tsx`/`Candidatos.tsx`/`EdgeFunctionMonitoring.tsx`
          #    nem têm "dashboard"/"chart" no path pra passar no filtro
          #    externo; `Insights.tsx`/`Dashboard.tsx` têm o array em
          #    múltiplas linhas, então nunca bateram o grep de linha
          #    única. 3+ literais hex em QUALQUER arquivo `.ts`/`.tsx`
          #    tocado já é sinal suficiente de array de cores hardcoded
          #    — é aviso, não bloqueio, então o custo de rodar em mais
          #    arquivos é só ruído, nunca PR travada.
          # ------------------------------------------------------------
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            hex_count=$(grep -oE '#[0-9A-Fa-f]{6}' "$f" 2>/dev/null | wc -l | tr -d ' ')
            if [ "${hex_count:-0}" -ge 3 ]; then
              echo "::warning file=$f::${hex_count} cores hex hardcoded — considere usar src/lib/chartPalette.ts (CHART_SERIES_COLORS/chartColor) em vez de hex fixo, pra herdar dark mode automaticamente."
            fi
          done < <(echo "$CHANGED_FILES_JSON" | jq -r '.[]')

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "::error::Padrões de bug conhecido encontrados (nas linhas adicionadas por esta PR). Corrija ou adicione o comentário de escape explícito se for falso positivo."
            exit 1
          fi

          echo "Nenhum padrão de bug conhecido encontrado nas linhas adicionadas."
